name: CD - Production

on:
  push:
    branches:
      - main
      - 'milestone-*'
    tags:
      - 'release-*'
  workflow_call:
  workflow_dispatch:

env:
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  DOTNET_VERSION: '10.0.x'

concurrency:
  group: cd-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: dotnet restore, build and publish
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet publish src/PV260.ArkFundsTracker.Web/PV260.ArkFundsTracker.Web.csproj -c Release -o '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/myapp'

      - name: Pack publish output
        run: |
          cd ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/myapp
          zip -r ../../app.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./app.zip

      - name: Readiness check
        shell: pwsh
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
        run: |
          $uri = "https://$env:APP_NAME.azurewebsites.net/health"
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -eq 200) {
                Write-Host "Production readiness check passed."
                exit 0
              }
            } catch {
              Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 10
          }

          throw "Production readiness check failed after deployment."

